services:
  dashboard:
    # Published image. Pin a version (e.g. :1.0) to update deliberately; build locally with compose.build.yaml.
    image: ${IMAGE:-ghcr.io/matthabjan/homelab-dashboard:latest}
    container_name: dashboard
    restart: unless-stopped
    # Only non-secret settings are passed as environment variables.
    # Credentials arrive as files in /run/secrets (see `secrets:` below), so they don't show up in `docker inspect`.
    environment:
      TZ: ${TZ:-UTC}
      DEMO: ${DEMO:-0}
      CONFIG_DIR: /config
      DATA_DIR: /data
      # Traefik terminates TLS; tell the app its public origin and the real client address
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: 1
      # trust your own CA for widget APIs (mount it below and uncomment)
      # NODE_EXTRA_CA_CERTS: /certs/ca.pem
    secrets:
      - pve_token_secret
      - pbs_token_secret
      - opnsense_key
      - opnsense_secret
      - omv_password
      - adguard_password
      - portainer_key
    volumes:
      # services/settings/bookmarks + icons/images; reloads automatically.
      # Use an absolute path when deploying as a Portainer stack from git (the repo clone has no config/).
      - ${CONFIG_PATH:-./config}:/config:ro
      - data:/data             # uptime history (SQLite)
      # - ./certs/ca.pem:/certs/ca.pem:ro
    # Hardening. The root filesystem stays writable only because Compose has to copy
    # the environment-sourced secrets into the container; switch every secret to `file:` to add `read_only: true`.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 512m
    # Optional DNS server for the container, e.g. your AdGuard / Pi-hole when the Docker host resolves elsewhere.
    # Unset = Docker's default (the host's resolver).
    dns: ${DNS_SERVER:-}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.dashboard.rule=Host(`${DASHBOARD_HOST:?set DASHBOARD_HOST, e.g. dashboard.example.com}`)
      - traefik.http.routers.dashboard.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      # wildcard certificate (DNS challenge): public CT logs show *.example.com instead of every service name
      - traefik.http.routers.dashboard.tls.domains[0].main=${TLS_DOMAIN:?set TLS_DOMAIN, e.g. example.com}
      - traefik.http.routers.dashboard.tls.domains[0].sans=*.${TLS_DOMAIN}
      # 1. admin-only@file: IP allowlist defined in Traefik's file provider (dynamic config), not here
      - traefik.http.routers.dashboard.middlewares=admin-only@file,dashboard-auth@docker,dashboard-headers@docker
      # 2. login. Value from `htpasswd -nbB <user> <password>`; see README for escaping the $ signs
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${DASHBOARD_AUTH_USERS:?set DASHBOARD_AUTH_USERS (htpasswd -nbB user password)}
      - traefik.http.middlewares.dashboard-auth.basicauth.realm=Homelab Dashboard
      - traefik.http.middlewares.dashboard-auth.basicauth.removeheader=true
      # 3. security headers (the Content-Security-Policy comes from the app itself, it needs per-request nonces)
      - traefik.http.middlewares.dashboard-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.dashboard-headers.headers.frameDeny=true
      - traefik.http.middlewares.dashboard-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.dashboard-headers.headers.referrerPolicy=no-referrer
      - traefik.http.middlewares.dashboard-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - traefik.http.middlewares.dashboard-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow
      # App manifest and icons without login: phones fetch them for "Install app" / the home-screen icon
      # without the basic-auth credentials. Still behind admin-only; these files hold nothing sensitive.
      - traefik.http.routers.dashboard-icons.rule=Host(`${DASHBOARD_HOST}`) && (Path(`/manifest.webmanifest`) || PathPrefix(`/assets/images/`))
      - traefik.http.routers.dashboard-icons.priority=1000
      - traefik.http.routers.dashboard-icons.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.dashboard-icons.tls=true
      - traefik.http.routers.dashboard-icons.middlewares=admin-only@file,dashboard-headers@docker
      - traefik.http.routers.dashboard-icons.service=dashboard
      - traefik.http.routers.dashboard.service=dashboard
      - traefik.http.services.dashboard.loadbalancer.server.port=3000

# Each secret is read from the variable of the same name (in .env or in Portainer's stack variables).
# Every variable must be defined; leave it empty for integrations you don't use.
secrets:
  pve_token_secret:
    environment: PVE_TOKEN_SECRET
  pbs_token_secret:
    environment: PBS_TOKEN_SECRET
  opnsense_key:
    environment: OPNSENSE_KEY
  opnsense_secret:
    environment: OPNSENSE_SECRET
  omv_password:
    environment: OMV_PASSWORD
  adguard_password:
    environment: ADGUARD_PASSWORD
  portainer_key:
    environment: PORTAINER_KEY

volumes:
  data:

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
