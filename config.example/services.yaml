# Same format as gethomepage's services.yaml.
#   icon:        file name in config/icons/ (e.g. proxmox.png), a dashboard-icons name (fetched from the CDN),
#                "sh-<name>" for selfh.st icons, or a full URL. Missing icon → picked by service name from
#                selfh.st / dashboard-icons, or a generated monogram when there's no match.
#   iconDark:    optional variant used in dark mode
#   siteMonitor: URL that is checked every 30 s (uptime, latency, TLS certificate)
#   latencyWarnMs: per-service "slow" limit in ms (default: settings.yaml → thresholds.latencyWarnMs)
#   tlsVerify:   false → accept a self-signed certificate for this service's widget API
#                (better: trust your CA with NODE_EXTRA_CA_CERTS, see README)
# Secrets: ${NAME} or {{HOMEPAGE_VAR_NAME}} — read from the environment or from /run/secrets/<name> (see README).

- Infrastructure:
    - Proxmox VE:
        icon: proxmox
        href: https://pve.home.arpa:8006
        description: Virtualization
        siteMonitor: https://pve.home.arpa:8006
        tlsVerify: false
        widget:
          type: proxmox
          url: https://pve.home.arpa:8006
          username: dashboard@pve!dashboard
          password: ${PVE_TOKEN_SECRET}
    - Proxmox Backup Server:
        icon: proxmox-backup-server
        href: https://pbs.home.arpa:8007
        description: Backups
        siteMonitor: https://pbs.home.arpa:8007
        tlsVerify: false
        widget:
          type: proxmoxbackupserver
          url: https://pbs.home.arpa:8007
          username: dashboard@pbs!dashboard
          password: ${PBS_TOKEN_SECRET}
          datastore: [main, offsite]   # one name, a list, or leave out for all; removable stores show as detached when unplugged
    - OPNsense:
        icon: opnsense
        href: https://opnsense.home.arpa
        description: Firewall
        siteMonitor: https://opnsense.home.arpa
        tlsVerify: false
        widget:
          type: opnsense
          url: https://opnsense.home.arpa
          username: ${OPNSENSE_KEY}
          password: ${OPNSENSE_SECRET}
          # wan: wan          # interface name if not "wan"
    - OpenMediaVault:
        icon: openmediavault
        href: https://nas.home.arpa
        description: Network storage
        siteMonitor: https://nas.home.arpa
        widget:
          type: openmediavault
          url: https://nas.home.arpa
          username: admin
          password: ${OMV_PASSWORD}

- Network:
    - FRITZ!Box:
        icon: avm-fritzbox
        href: http://192.168.178.1
        description: Router
        siteMonitor: http://192.168.178.1
        widget:
          type: fritzbox
          url: http://192.168.178.1
    - AdGuard Home:
        icon: adguard-home
        href: https://adguard.home.arpa
        description: DNS and ad blocking
        siteMonitor: https://adguard.home.arpa
        widget:
          type: adguard
          url: https://adguard.home.arpa
          username: admin
          password: ${ADGUARD_PASSWORD}
    - Pi-hole:
        icon: pi-hole
        href: https://pihole.home.arpa/admin
        description: Second DNS resolver
        siteMonitor: https://pihole.home.arpa/admin
        widget:
          type: pihole
          url: https://pihole.home.arpa
          key: ${PIHOLE_APP_PASSWORD}   # v6: an app password; v5: add `version: 5` and use the API token

- Apps:
    - Portainer:
        icon: portainer
        href: https://portainer.home.arpa
        description: Containers
        siteMonitor: https://portainer.home.arpa
        widget:
          type: portainer
          url: https://portainer.home.arpa
          env: 1
          key: ${PORTAINER_KEY}
    - docker-02:
        icon: docker
        description: Second Docker host, through a socket proxy
        widget:
          type: docker
          url: http://docker-02.home.arpa:2375   # docker-socket-proxy, never the socket itself
    - Home Assistant:
        icon: home-assistant
        href: https://ha.home.arpa
        description: Home automation
        siteMonitor: https://ha.home.arpa

- Entertainment:
    - MusicAssistant:
        icon: music-assistant
        href: https://music.home.arpa
        description: Music library and players
        siteMonitor: https://music.home.arpa
    - Media server:
        icon: jellyfin
        href: https://media.home.arpa
        description: Any JSON API, through the customapi widget
        siteMonitor: https://media.home.arpa
        widget:
          type: customapi
          url: https://media.home.arpa/api/status
          # headers: { X-Api-Key: "${MEDIA_KEY}" }
          mappings:
            - field: sessions.active
              label: sessions
              format: number
            - field: library.items
              label: items
              format: number
            - field: healthy
              label: health
              remap: [{ value: true, to: OK }, { value: false, to: Degraded }]
              crit: { below: 1 }        # our addition: alerts when the server reports unhealthy
