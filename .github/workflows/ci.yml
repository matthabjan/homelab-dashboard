# Every push and pull request: type check, tests, image build and a smoke test of the built image.
# Pushes then publish the image to Docker Hub (matthabjan/homelab-dashboard):
#   push to development → :dev
#   push to main        → :edge (+ :sha-<commit>)
#   tag vX.Y.Z          → :X.Y.Z, :X.Y, :X, :latest (+ GitHub Release, Docker Hub description)
# Build once, promote: main and tags have the files development had (merging changes the commit, not the tree),
# so when :dev was built from the same tree, those tags are added to that image, the exact one that was tested,
# and nothing is checked or built again. Otherwise (development has moved on) they are checked and built here.
#   pull request        → all checks and both architectures built, nothing is pushed
#                         (skipped for development → main: the push run already checked that tree)
# Published images carry buildx provenance and an SBOM, plus a GitHub artifact attestation:
#   gh attestation verify oci://docker.io/matthabjan/homelab-dashboard:<tag> --repo matthabjan/homelab-dashboard
# Requires repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Docker Hub access token, Read & Write).
# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) keeps them current.
name: CI

on:
  push:
    branches: [main, development]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: matthabjan/homelab-dashboard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # every other job needs this one, so they are skipped along with it
    if: github.event_name != 'pull_request' || github.head_ref != 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      promote: ${{ steps.dev.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # the digest is read first and the revision from it, so a :dev pushed in between cannot slip in
      - name: Is :dev built from this tree?
        id: dev
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:dev" --format '{{json .Manifest.Digest}}' | jq -r .) || exit 0
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 0
          rev=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' |
            jq -r '[.[].config.Labels["org.opencontainers.image.revision"]] | unique | if length == 1 then .[0] else "" end') || exit 0
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || exit 0
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$rev" --jq .tree.sha) || exit 0
          if [ "$tree" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "Promoting $IMAGE@$digest, built from $rev (same tree)"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo ":dev was built from $rev, which has other files: checking and building"
          fi

  check:
    needs: plan
    if: needs.plan.outputs.promote == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the Node major of the image (NODE_IMAGE in the Dockerfile), so tests and image agree on the runtime
      - name: Node version from the Dockerfile
        id: node
        run: echo "major=$(grep -oP '^ARG NODE_IMAGE=node:\K\d+' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}
          # no npm cache: this workflow publishes, and a restored cache is a poisoning path (zizmor).
          # The buildx cache (type=gha) is kept deliberately: it saves the rebuilds, and tag and main
          # runs only restore caches written on main, which takes push access to main to poison.
          # (A promoted release image was built on development, so pushing there is trusted the same.)

      - run: npm ci --ignore-scripts
      - name: Type check
        run: npm run check
      - name: Test
        run: npm test

  image:
    needs: [plan, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # no QEMU: every RUN step in the Dockerfile runs on the runner's own platform
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: homelab-dashboard:smoke
          cache-from: type=gha

      # the real image in demo mode: the engine starts, every integration runs on its fixtures
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 -e DEMO=1 homelab-dashboard:smoke
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/state | jq -e '.verdict.title and (.groups | length > 0) and (.host.gauges | length > 0)' >/dev/null
          curl -fsS -o /dev/null http://127.0.0.1:3000/

      # without DEMO the image runs the starter config: it must be the one in the repo, and work as it is
      - name: Starter config
        run: |
          docker run --rm --entrypoint cat homelab-dashboard:smoke /config/services.yaml | diff - config.starter/services.yaml
          docker run -d --name starter -p 3001:3000 homelab-dashboard:smoke
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          # the local host appears after the first widget round
          for _ in $(seq 10); do
            curl -fsS http://127.0.0.1:3001/api/state | jq -e '(.groups | length > 0) and (.host.name == "this host")' >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/state | jq -e '(.groups | length > 0) and (.host.name == "this host")' >/dev/null
          curl -fsS -o /dev/null http://127.0.0.1:3001/config

      - name: Container log
        if: failure()
        run: docker logs smoke; docker logs starter || true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: &flavor |
            latest=auto
          tags: &tags |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          # package.json's version rather than the tag's, so a :dev image promoted to a release carries it
          labels: |
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # the provenance, SBOM and attestation were made for this digest when it was built, so they carry over
  promote:
    needs: plan
    if: needs.plan.outputs.promote != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: *flavor
          tags: *tags

      - name: Tag the :dev image
        env:
          DIGEST: ${{ needs.plan.outputs.promote }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags < <(grep . <<<"$TAGS")
          docker buildx imagetools create "${tags[@]/#/--tag=}" "$IMAGE@$DIGEST"
          for tag in "${tags[@]}"; do
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | jq -r .)
            [ "$got" = "$DIGEST" ] || { echo "::error::$tag is $got, expected $DIGEST"; exit 1; }
            echo "$tag → $DIGEST"
          done

  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.image.result == 'success' || needs.promote.result == 'success') }}
    needs: [image, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        # a release drafted in the GitHub UI creates the tag too, and so already exists: keep it
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as is"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              $([ "$PRERELEASE" = true ] && echo --prerelease)
          fi

  hub-description:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.image.result == 'success' || needs.promote.result == 'success') }}
    needs: [image, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: Self-hosted homelab dashboard (SvelteKit, port 3000)
          readme-filepath: ./README.md
          enable-url-completion: true
