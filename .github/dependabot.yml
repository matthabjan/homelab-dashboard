version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # Majors (SvelteKit, Vite, Svelte …) are upgraded deliberately.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # node major bumps are upgraded deliberately.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # Action majors are only exercised by a real release run; bump them deliberately.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']
